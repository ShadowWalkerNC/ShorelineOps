name: Account service
on:
  pull_request:
    paths: ['control-plane/**', '.github/workflows/control-plane.yml']
  push:
    branches: [main]
    paths: ['control-plane/**', '.github/workflows/control-plane.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  accounts:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: shoreline_test
          POSTGRES_PASSWORD: isolated-test-only
          POSTGRES_DB: shoreline_control_test_ci
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready --health-interval 5s
          --health-timeout 5s --health-retries 12
    defaults:
      run:
        working-directory: control-plane
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: control-plane/package-lock.json
      - run: npm ci --workspaces=false
      - run: npm run build
      - run: npm test
        env:
          NODE_ENV: test
          CONTROL_TEST_DATABASE_URL: postgresql://shoreline_test:isolated-test-only@127.0.0.1:5432/shoreline_control_test_ci
