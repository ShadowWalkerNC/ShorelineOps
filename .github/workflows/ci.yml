name: ShorelineOps CI/CD Verification

on:
  push:
    branches: [ main, master, 'feature/**', 'fix/**' ]
  pull_request:
    branches: [ main, master ]

jobs:
  verify:
    name: Typecheck, Build & System Verification
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js 24.x
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: 'npm'

      - name: Install Workspace Dependencies
        run: npm ci

      - name: Client Typecheck
        run: npm run typecheck

      - name: Client Production Build (PWA)
        run: npm run build

      - name: Server Production Build (TypeScript)
        working-directory: server
        run: npm run build
      - name: Marketing Production Build (Astro)
        run: npm run build:marketing

      - name: Run Full Automated Test Suite
        run: npm test

  postgres-acceptance:
    name: Isolated PostgreSQL decision acceptance
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: shoreline_test
          POSTGRES_PASSWORD: disposable_test_only
          POSTGRES_DB: shoreline_acceptance
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U shoreline_test -d shoreline_acceptance"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Verify migrations, stale tray rejection and concurrent EHR decisions
        run: npm run test:postgres
        env:
          SHORELINE_TEST_POSTGRES_URL: postgresql://shoreline_test:disposable_test_only@127.0.0.1:5432/shoreline_acceptance
      - name: Verify encrypted logical backup and isolated restoration
        run: node scripts/restore-drill.mjs "${{ job.services.postgres.id }}"

  spark-sdk:
    name: Isolated Spark SDK boundaries
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: tools/muse/package-lock.json
      - run: npm ci --prefix tools/muse
      - run: npm --prefix tools/muse test
      - run: npm --prefix tools/muse run check

  container-smoke:
    name: Compiled Linux container readiness
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t shorelineops:ci .
      - name: Verify isolated SQLite readiness and application route
        shell: bash
        run: |
          container=$(docker run -d --env JWT_SECRET=synthetic-ci-container-signing-key-only --env SQLITE_PATH=/tmp/shoreline-ci.sqlite --env SHORELINE_DEMO_SEED=false shorelineops:ci)
          trap 'docker rm -f "$container" >/dev/null' EXIT
          ready=false
          for attempt in $(seq 1 40); do
            if docker exec "$container" curl -fs http://localhost:3001/ready >/dev/null; then
              ready=true
              break
            fi
            sleep 1
          done
          if [ "$ready" != true ]; then
            docker logs "$container"
            exit 1
          fi
          docker exec "$container" node -e 'fetch("http://localhost:3001/app/login").then(async response => { if(response.status !== 200 || !(await response.text()).includes("app/assets")) process.exit(1) }).catch(() => process.exit(1))'
