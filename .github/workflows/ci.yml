name: ShorelineOps CI/CD Verification

on:
  push:
    branches: [ main, master, 'feature/**', 'fix/**' ]
  pull_request:
    branches: [ main, master ]

jobs:
  verify:
    name: Typecheck, Build & System Verification
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20.x
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Client Dependencies
        run: npm ci

      - name: Install Server Dependencies
        working-directory: server
        run: npm ci

      - name: Client Typecheck
        run: npm run typecheck

      - name: Client Production Build (PWA)
        run: npm run build

      - name: Server Production Build (TypeScript)
        working-directory: server
        run: npm run build

      - name: Run Full System Verification Suite (52/52 Tests)
        working-directory: server
        run: node dist/system.test.js
