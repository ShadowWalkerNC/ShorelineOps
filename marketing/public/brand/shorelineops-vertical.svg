<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 240" width="240" height="240" role="img" aria-label="ShorelineOps Vertical Logo">
  <defs>
    <linearGradient id="vHorizonGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0284C7" />
      <stop offset="50%" stop-color="#0EA5E9" />
      <stop offset="100%" stop-color="#14B8A6" />
    </linearGradient>

    <linearGradient id="vShieldBg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0F172A" />
      <stop offset="100%" stop-color="#020617" />
    </linearGradient>

    <linearGradient id="vPulseGrad" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#38BDF8" />
      <stop offset="50%" stop-color="#2DD4BF" />
      <stop offset="100%" stop-color="#A7F3D0" />
    </linearGradient>
  </defs>

  <!-- Centered Icon Mark (Origin x=120, y=70) -->
  <g transform="translate(0, -4)">
    <rect x="72" y="16" width="96" height="96" rx="24"
          fill="url(#vShieldBg)"
          stroke="url(#vHorizonGrad)"
          stroke-width="2.5" />

    <rect x="78" y="22" width="84" height="84" rx="18"
          fill="none"
          stroke="#1E293B"
          stroke-width="1.1"
          stroke-dasharray="2.5 2.5" />

    <!-- Horizon Wave -->
    <path d="M 84,78 C 100,68 112,66 120,70 C 128,74 140,84 156,74" 
          fill="none" 
          stroke="url(#vHorizonGrad)" 
          stroke-width="2.5" 
          stroke-linecap="round" />

    <!-- Caduceus + IDDSI -->
    <g transform="translate(120, 52)">
      <polygon points="0,15 -14,-8 14,-8"
               fill="none"
               stroke="#0D9488"
               stroke-width="1.8"
               stroke-linejoin="round" />
      <line x1="-8" y1="0" x2="8" y2="0"
            stroke="#38BDF8"
            stroke-width="1.5"
            stroke-linecap="round" />
      <line x1="0" y1="-18" x2="0" y2="24"
            stroke="url(#vPulseGrad)"
            stroke-width="2.2"
            stroke-linecap="round" />
      <path d="M -11,-11 C -6,-19 0,-14 0,-8 C 0,-2 8,-7 11,-13"
            fill="none"
            stroke="#38BDF8"
            stroke-width="1.8"
            stroke-linecap="round" />
      <circle cx="0" cy="-18" r="2.5" fill="#F8FAFC" />
    </g>

    <!-- Nodes -->
    <circle cx="88" cy="32" r="2" fill="#38BDF8" />
    <circle cx="152" cy="32" r="2" fill="#2DD4BF" />
    <circle cx="88" cy="96" r="2" fill="#0EA5E9" />
    <circle cx="152" cy="96" r="2" fill="#14B8A6" />
  </g>

  <!-- Centered Typography -->
  <g text-anchor="middle">
    <text x="120" y="165"
          font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif"
          font-size="28"
          font-weight="800"
          letter-spacing="-0.5">
      <tspan fill="#FFFFFF">Shoreline</tspan><tspan fill="#14B8A6">Ops</tspan>
    </text>

    <!-- Subtitle -->
    <text x="120" y="191"
          font-family="'SF Mono', 'Fira Code', 'Cascadia Code', monospace"
          font-size="9"
          font-weight="600"
          letter-spacing="2.2"
          fill="#94A3B8">HEALTHCARE DIETARY OS</text>

    <!-- Clinical Badge / Compliance Mark -->
    <text x="120" y="210"
          font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif"
          font-size="8.5"
          font-weight="700"
          letter-spacing="1"
          fill="#0EA5E9">IDDSI 0–7 · CMS-2567 VERIFIED</text>
  </g>
</svg>
