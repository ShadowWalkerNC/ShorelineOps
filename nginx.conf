# ShorelineOps optional reverse proxy snippet (HTTP only).
#
# Mounted at /etc/nginx/conf.d/default.conf by docker-compose.production.yml
# (a server block must not replace the main nginx.conf). The api service is a
# unified single-port container (static app + API on 3001), so every request
# is proxied there; this file serves no local static assets.
#
# No TLS is configured here: terminate HTTPS upstream (load balancer / edge)
# or extend this snippet with certificates. TLS termination in this proxy is
# untested — do not advertise :443 until a tested TLS setup exists.
server {
    listen 80;
    server_name localhost;

    location / {
        proxy_pass http://api:3001;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
    }
}
