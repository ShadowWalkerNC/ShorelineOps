services:
  shorelineops:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: shorelineops_app
    restart: unless-stopped
    ports:
      - "3001:3001"
    environment:
      - NODE_ENV=production
      - PORT=3001
      - JWT_SECRET=shoreline_production_jwt_secret_change_me_before_prod_12345
      - DATABASE_URL=postgresql://shoreline:shoreline_secure_pass@db:5432/shorelineops
    depends_on:
      db:
        condition: service_healthy

  db:
    image: postgres:16-alpine
    container_name: shorelineops_db
    restart: unless-stopped
    environment:
      - POSTGRES_USER=shoreline
      - POSTGRES_PASSWORD=shoreline_secure_pass
      - POSTGRES_DB=shorelineops
    volumes:
      - shoreline_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U shoreline -d shorelineops"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  shoreline_pgdata:
