version: '3.8'

services:
  # PostgreSQL Database
  postgres:
    image: postgres:15-alpine
    container_name: shoreline-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: shorelineops
      POSTGRES_USER: shoreline
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change_this_secure_password_in_prod}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U shoreline -d shorelineops"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Express.js Backend API
  api:
    build:
      context: ./server
      dockerfile: Dockerfile
    container_name: shoreline-api
    restart: unless-stopped
    environment:
      PORT: 3001
      NODE_ENV: production
      DATABASE_URL: postgresql://shoreline:${POSTGRES_PASSWORD:-change_this_secure_password_in_prod}@postgres:5432/shorelineops
      JWT_SECRET: ${JWT_SECRET:-generate_a_64_character_random_secret_here_for_prod}
      SETUP_BOOTSTRAP_SECRET: ${SETUP_BOOTSTRAP_SECRET:-setup_secret_min_16_chars}
      KIOSK_API_SECRET: ${KIOSK_API_SECRET:-kiosk_secret_min_16_chars}
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost}
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "3001:3001"

  # React Frontend PWA
  web:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: shoreline-web
    restart: unless-stopped
    ports:
      - "80:80"
    depends_on:
      - api

volumes:
  postgres_data:
