[package]
name = "shorelineops-client"
version = "0.1.0"
edition = "2024"
rust-version = "1.95"
publish = false

[lib]
crate-type = ["rlib", "cdylib"]

[[bin]]
name = "shorelineops-worklist"
path = "src/main.rs"

[dependencies]
eframe = { version = "0.37.0", default-features = false, features = [
    "default_fonts",
    "glow",
    "wayland",
    "x11",
] }

[target.'cfg(not(target_os = "android"))'.dependencies]
eframe = { version = "0.37.0", default-features = false, features = ["accesskit"] }

[target.'cfg(target_os = "windows")'.dependencies]
windows-sys = { version = "0.61.2", features = [
    "Win32_Foundation", "Win32_Graphics_Gdi", "Win32_Storage_Xps",
    "Win32_UI_Controls_Dialogs", "Win32_UI_Input_KeyboardAndMouse",
] }

[target.'cfg(target_os = "android")'.dependencies]
# NativeActivity proves rendering and lifecycle only. eframe requires
# GameActivity for AccessKit, which needs a separate packaging proof.
eframe = { version = "0.37.0", default-features = false, features = ["android-native-activity"] }
winit = { version = "0.30", default-features = false, features = ["android-native-activity"] }

[package.metadata.android]
package = "org.shorelineops.platformproof"
build_targets = ["aarch64-linux-android"]

[package.metadata.android.sdk]
min_sdk_version = 26
target_sdk_version = 35

[package.metadata.android.application]
label = "ShorelineOps Platform Proof"
