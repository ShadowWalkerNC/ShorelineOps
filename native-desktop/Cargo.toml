[workspace]
members = ["client", "core"]
default-members = ["client"]
resolver = "3"

[package]
name = "shorelineops-native"
version = "0.1.0"
edition = "2024"
publish = false

[dependencies]
windows-sys = { version = "0.61.2", features = [
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_System_LibraryLoader",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_WindowsAndMessaging",
] }
