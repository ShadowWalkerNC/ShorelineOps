# Render Blueprint Specification for ShorelineOps
# Official 1-Click Multi-Service Deployment for Render (https://render.com)
version: "1"

services:
  # ============================================================================
  # 1. Shoreline API Backend (Node / Express / TypeScript)
  # ============================================================================
  - type: web
    name: shoreline-api
    runtime: node
    plan: free
    region: oregon
    rootDir: server
    buildCommand: npm install && npm run build
    startCommand: npm start
    healthCheckPath: /ready
    autoDeploy: true
    envVars:
      - key: NODE_VERSION
        value: "20.14.0"
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 3001
      - key: JWT_SECRET
        generateValue: true
      - key: FRONTEND_URL
        value: https://shoreline-demo.onrender.com
      - key: DATABASE_URL
        fromDatabase:
          name: shoreline-db
          property: connectionString

  # ============================================================================
  # 2. Shoreline Unified Static Origin (Marketing + Demo + App, one deploy)
  # build:demo merges the Astro marketing site at / with the Vite demo shell
  # at /demo/ and the Vite production app shell at /app/ into a single dist/.
  # ============================================================================
  - type: web
    name: shoreline-demo
    runtime: static
    buildCommand: npm install && npm run build:demo
    staticPublishPath: dist
    autoDeploy: true
    routes:
      # Scoped SPA fallbacks, one shell per prefix. Render serves real files
      # first, so these rewrites only catch client-side routes. There is
      # intentionally no blanket /* rule: it served the marketing shell for
      # every /demo/* and /app/* refresh (e.g. /demo/reporting -> homepage).
      - type: rewrite
        source: /demo
        destination: /demo/index.html
      - type: rewrite
        source: /demo/*
        destination: /demo/index.html
      - type: rewrite
        source: /app
        destination: /app/index.html
      - type: rewrite
        source: /app/*
        destination: /app/index.html
    envVars:
      - key: NODE_VERSION
        value: "20.14.0"
      - key: VITE_DEMO_MODE
        value: "true"
      # Consumed only by the /app production bundle (the /demo shell is a
      # serverless sandbox and never calls this API). Must keep the /api
      # suffix: the Axios client and tokenManager append /auth/* to it.
      - key: VITE_API_URL
        value: https://shoreline-api.onrender.com/api

  # ============================================================================
  # 3. Shoreline Marketing & Developer Portal (Astro Static Site)
  # ============================================================================
  - type: web
    name: shoreline-marketing
    runtime: static
    rootDir: marketing
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    autoDeploy: true
    envVars:
      - key: NODE_VERSION
        value: "20.14.0"

# ==============================================================================
# Managed PostgreSQL Database
# ==============================================================================
databases:
  - name: shoreline-db
    plan: free
    region: oregon
    databaseName: shoreline
    user: shoreline_user
