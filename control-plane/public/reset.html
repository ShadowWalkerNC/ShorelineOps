<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Reset password — ShorelineOps</title>
<link rel="stylesheet" href="/site.css">
</head>
<body data-page="reset">
<main>
<h1>Reset password</h1>
<h2>Step 1 — request a link</h2>
<form id="request-form">
<label for="email">Email address
<input id="email" name="email" type="email" inputmode="email" autocomplete="email" required maxlength="254">
</label>
<button type="submit">Send reset link</button>
</form>
<h2>Step 2 — set a new password</h2>
<form id="confirm-form">
<label for="token">Reset code from the email
<input id="token" name="token" type="text" autocomplete="off" required maxlength="500">
</label>
<label for="password">New password <span class="hint">(at least 12 characters)</span>
<input id="password" name="password" type="password" autocomplete="new-password" required minlength="12" maxlength="200">
</label>
<button type="submit">Set new password</button>
</form>
<p id="result" role="status" aria-live="polite"></p>
<p><a href="/">Back to start</a></p>
</main>
<script src="/portal.js" defer></script>
</body>
</html>
