<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128" role="img" aria-label="ShorelineOps Icon">
  <defs>
    <!-- Coastal Horizon Cyan-to-Teal Gradient -->
    <linearGradient id="horizonGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0284C7" />
      <stop offset="50%" stop-color="#0EA5E9" />
      <stop offset="100%" stop-color="#14B8A6" />
    </linearGradient>

    <!-- Deep Clinical Slate Hex/Circle Fill -->
    <linearGradient id="shieldBg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0F172A" />
      <stop offset="100%" stop-color="#020617" />
    </linearGradient>

    <!-- Medical Pulse / Caduceus Glow Gradient -->
    <linearGradient id="pulseGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38BDF8" />
      <stop offset="50%" stop-color="#2DD4BF" />
      <stop offset="100%" stop-color="#A7F3D0" />
    </linearGradient>

    <!-- IDDSI Triangles Texture Indicator Gradient -->
    <linearGradient id="iddsiGrad" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#0D9488" />
      <stop offset="100%" stop-color="#2DD4BF" />
    </linearGradient>

    <!-- Subtle Outer Glow -->
    <filter id="tealGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2.5" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Outer Protective Clinical Shield/Ring -->
  <rect x="8" y="8" width="112" height="112" rx="28"
        fill="url(#shieldBg)"
        stroke="url(#horizonGrad)"
        stroke-width="2.5" />

  <!-- Inner Subtle Calibration Frame (Medical Precision) -->
  <rect x="16" y="16" width="96" height="96" rx="20"
        fill="none"
        stroke="#1E293B"
        stroke-width="1.2"
        stroke-dasharray="3 3" />

  <!-- The Horizon Curve (Coastal Baseline / Sanctuary) -->
  <path d="M 22,78 
           C 42,66 54,64 64,68 
           C 74,72 88,84 106,72" 
        fill="none" 
        stroke="url(#horizonGrad)" 
        stroke-width="3" 
        stroke-linecap="round" />

  <!-- Second Lower Tide Layer -->
  <path d="M 26,88 
           C 46,78 56,76 66,80 
           C 76,84 88,94 102,84" 
        fill="none" 
        stroke="#0F766E" 
        stroke-width="2" 
        stroke-linecap="round" 
        opacity="0.8" />

  <!-- IDDSI Pyramid Inverted Triangle Geometry (Levels 0-7 Safety Matrix) -->
  <g id="iddsi-matrix" transform="translate(64, 46)">
    <!-- Central Inverted Triangle: Clinical Dysphagia Standard -->
    <polygon points="0,18 -16,-10 16,-10"
             fill="none"
             stroke="url(#iddsiGrad)"
             stroke-width="2"
             stroke-linejoin="round" />

    <!-- Pureed Horizon Level 4 Segment -->
    <line x1="-10" y1="0" x2="10" y2="0"
          stroke="#38BDF8"
          stroke-width="1.8"
          stroke-linecap="round" />

    <!-- Central Caduceus Staff & Care Coordination Ascending Beam -->
    <line x1="0" y1="-22" x2="0" y2="28"
          stroke="url(#pulseGrad)"
          stroke-width="2.5"
          stroke-linecap="round"
          filter="url(#tealGlow)" />

    <!-- Caduceus Dual Care Arcs / Therapeutic Harmony Wings -->
    <path d="M -14,-14 C -8,-24 0,-18 0,-10 C 0,-2 10,-8 14,-16"
          fill="none"
          stroke="#38BDF8"
          stroke-width="2"
          stroke-linecap="round" />
    <path d="M 14,-14 C 8,-24 0,-18 0,-10 C 0,-2 -10,-8 -14,-16"
          fill="none"
          stroke="#2DD4BF"
          stroke-width="2"
          stroke-linecap="round" />

    <!-- Crown Clinical Spark (Accreditation / CMS-2567 Readiness) -->
    <circle cx="0" cy="-22" r="3" fill="#F8FAFC" />
  </g>

  <!-- Vital Care Pulse Nodes (Corner Coordinates) -->
  <circle cx="28" cy="28" r="2.5" fill="#38BDF8" />
  <circle cx="100" cy="28" r="2.5" fill="#2DD4BF" />
  <circle cx="28" cy="100" r="2.5" fill="#0EA5E9" />
  <circle cx="100" cy="100" r="2.5" fill="#14B8A6" />
</svg>
