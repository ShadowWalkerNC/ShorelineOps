<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128" role="img" aria-label="ShorelineOps Monochrome Logo">
  <!-- Outer Shield Outline -->
  <rect x="8" y="8" width="112" height="112" rx="28"
        fill="none"
        stroke="#FFFFFF"
        stroke-width="3" />

  <!-- Inner Calibration Grid -->
  <rect x="16" y="16" width="96" height="96" rx="20"
        fill="none"
        stroke="#FFFFFF"
        stroke-width="1.2"
        stroke-dasharray="3 3" />

  <!-- Horizon Wave Silhouette -->
  <path d="M 22,78 C 42,66 54,64 64,68 C 74,72 88,84 106,72" 
        fill="none" 
        stroke="#FFFFFF" 
        stroke-width="3" 
        stroke-linecap="round" />

  <!-- IDDSI Triangle Outline -->
  <polygon points="64,64 48,36 80,36"
           fill="none"
           stroke="#FFFFFF"
           stroke-width="2"
           stroke-linejoin="round" />

  <!-- Medical Cross / Level 4 Horizontal Notch -->
  <line x1="54" y1="46" x2="74" y2="46"
        stroke="#FFFFFF"
        stroke-width="2"
        stroke-linecap="round" />

  <!-- Caduceus Center Staff -->
  <line x1="64" y1="24" x2="64" y2="74"
        stroke="#FFFFFF"
        stroke-width="2.5"
        stroke-linecap="round" />

  <!-- Dual Wing Curvature -->
  <path d="M 50,35 C 56,27 64,32 64,38 C 64,44 72,40 78,32"
        fill="none"
        stroke="#FFFFFF"
        stroke-width="2"
        stroke-linecap="round" />

  <!-- Nodes -->
  <circle cx="64" cy="24" r="3" fill="#FFFFFF" />
  <circle cx="28" cy="28" r="2.5" fill="#FFFFFF" />
  <circle cx="100" cy="28" r="2.5" fill="#FFFFFF" />
  <circle cx="28" cy="100" r="2.5" fill="#FFFFFF" />
  <circle cx="100" cy="100" r="2.5" fill="#FFFFFF" />
</svg>
